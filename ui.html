<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-browse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e0a45f' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M21 12a8 8 0 01-11.3 7.3L3 21l1.7-6.7A8 8 0 1121 12z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/ui/styles.css">
<link rel="modulepreload" href="/ui/helpers.js">
<link rel="modulepreload" href="/ui/state.js">
<link rel="modulepreload" href="/ui/list.js">
<link rel="modulepreload" href="/ui/detail.js">
<link rel="modulepreload" href="/ui/timeline.js">
<link rel="modulepreload" href="/ui/live-board.js">
<link rel="modulepreload" href="/ui/scope-drawer.js">
<script type="module" src="/ui/main.js"></script>
<script type="module" src="/ui/scope-drawer.js"></script>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand"><span class="dot"></span>cc-browse</span>

    <button id="scope-chip" title="set the scope (S)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M7 12h10M10 18h4"/>
      </svg>
      <span class="read"></span>
      <span class="kbd">S</span>
    </button>

    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="q" placeholder="search everything, or paste a session id…" autocomplete="off" spellcheck="false">
      <span class="qmeta" id="qmeta"></span>
      <span class="kbd">/</span>
    </label>

    <div id="tlnav">
      <button id="tlprev" title="previous">‹</button>
      <button id="tltoday">today</button>
      <button id="tlnext" title="next">›</button>
      <span class="period" id="tllabel"></span>
    </div>

    <div class="pop" id="pop-sort">
      <button class="trigger">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 7h16M4 12h10M4 17h5"/>
        </svg>
        <span class="label">recent</span>
        <svg class="caret" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="menu right" style="min-width:190px"><div class="menu-list"></div></div>
    </div>

    <div class="seg" id="view">
      <button data-v="list" class="on">list</button>
      <button data-v="day">day</button>
      <button data-v="week">week</button>
      <button data-v="month">month</button>
    </div>

    <span class="bar-sep"></span>

    <button id="live-btn" title="sessions waiting on you">
      <span class="dot"></span>Live
      <span class="n" id="live-n" hidden>0</span>
    </button>
  </div>

  <div class="subbar">
    <div class="narrow" id="searchmodes" hidden></div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main>
  <div id="scope" hidden>
    <div class="sc-scrim"></div>
    <div class="sc-panel" role="dialog" aria-label="scope">
      <div class="sc-head">
        <div class="sc-title">
          <span>Scope</span>
          <span class="esc">close <span class="kbd">Esc</span></span>
        </div>
        <label class="sc-filter">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
          </svg>
          <input id="scope-q" placeholder="filter…" autocomplete="off" spellcheck="false">
        </label>
      </div>
      <div class="sc-body">
        <div class="sc-sec" id="sc-projects"></div>
        <div class="sc-sec" id="sc-branches"></div>
        <div class="sc-sec">
          <div class="sc-h"><span class="k">Range</span></div>
          <div class="seg sc-seg" id="sc-since">
            <button data-v="" class="on">all</button>
            <button data-v="1">today</button>
            <button data-v="7">7d</button>
            <button data-v="30">30d</button>
          </div>
        </div>
        <div class="sc-sec" id="sc-flags"></div>
      </div>
      <div class="sc-foot">
        <span><b id="sc-count">—</b> sessions match</span>
        <button id="sc-reset">Reset</button>
      </div>
    </div>
  </div>
  <div id="list"></div>
  <div id="detail">
    <div class="placeholder" id="dempty">
      <svg class="art" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M21 12a8 8 0 01-11.3 7.3L3 21l1.7-6.7A8 8 0 1121 12z"/>
      </svg>
      <div class="hint">
        pick a conversation<br>
        <span class="kbd">↑</span><span class="kbd">↓</span> move &nbsp; <span class="kbd">↵</span> open &nbsp; <span class="kbd">/</span> search<br>
        <span class="kbd">f</span> find in conversation &nbsp; <span class="kbd">n</span><span class="kbd">N</span> next / previous match
      </div>
    </div>
    <div id="dhead" hidden>
      <h2 id="dtitle"></h2>
      <div class="sub">
        <span id="dmeta"></span>
        <span class="chip click" id="dresume" title="copy resume command"></span>
        <span class="pop" id="dusage" hidden>
          <button class="chip click" id="dcost" style="color:var(--accent);border-color:var(--accent-dim)"></button>
          <div class="menu right" id="dbreak"></div>
        </span>
        <span class="dtools">
          <span class="seg" id="dview" hidden>
            <button class="on" data-v="transcript">transcript</button>
            <button data-v="lanes">lanes</button>
          </span>
          <button class="tgl on" id="t-reader">reader</button>
          <button class="tgl" data-k="thinking">thinking</button>
          <button class="tgl" data-k="tool">tools</button>
          <button class="tgl" data-k="tool_result">results</button>
        </span>
      </div>
    </div>
    <div id="creader" hidden>
    <div id="findbar" hidden>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="fq" placeholder="find in conversation…" autocomplete="off" spellcheck="false">
      <span class="count" id="fcount"></span>
      <button id="freveal" hidden></button>
      <span class="fsep"></span>
      <button id="fprev" title="previous match (N)">↑</button>
      <button id="fnext" title="next match (n)">↓</button>
      <button id="fclose" title="close (Esc)">×</button>
    </div>
    <div id="convo"></div>
    <div id="lanes" hidden></div>
    <div id="jump">
      <button id="jtop">↑ top</button>
      <button id="jbot">↓ latest</button>
    </div>
    </div>
  </div>
  <div id="timeline" hidden></div>
  <div id="live" hidden></div>
</main>
<div id="lanetip" hidden></div>
<div id="toast"></div>
</body>
</html>
